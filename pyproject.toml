[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-network-monitor"
version = "1.0.0"
description = "A lightweight Linux TCP connectivity monitoring CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Linux Network Monitoring Project"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["netwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
